# Reusable SAST gate (Semgrep OSS CLI, vendored rules, offline).
#
# Fails the job on ERROR/WARNING-severity findings from the vendored rules in
# rules/semgrep/, or when the scan cannot be trusted (fails closed). No Semgrep
# account, token, or registry download is used. A pass means "these patterns
# did not match", not that the code is free of vulnerabilities.
#
# Current scope: called from workflows in this repository (runs
# scripts/sast.py and rules/ from the checked-out repo). Cross-repo packaging
# is planned - see docs/TASKS.md.
name: sast (reusable)

on:
  workflow_call:
    inputs:
      targets:
        description: Space-separated files/directories to scan.
        required: true
        type: string
      exclude:
        description: Space-separated path patterns passed to semgrep --exclude.
        required: false
        type: string
        default: ""
      forbid-paths:
        description: Space-separated paths that must never be scanned (gate errors if they are).
        required: false
        type: string
        default: ""
      python-version:
        description: Python version used to run Semgrep and the gate script.
        required: false
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pinned scan tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-tools.txt
      - name: Run SAST gate
        env:
          TARGETS: ${{ inputs.targets }}
          EXCLUDE: ${{ inputs.exclude }}
          FORBID: ${{ inputs.forbid-paths }}
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
        run: |
          read -r -a targets <<< "$TARGETS"
          read -r -a excludes <<< "$EXCLUDE"
          read -r -a forbids <<< "$FORBID"
          args=("${targets[@]}")
          for e in "${excludes[@]}"; do args+=(--exclude "$e"); done
          for f in "${forbids[@]}"; do args+=(--forbid-path "$f"); done
          python scripts/sast.py --report semgrep-report.json "${args[@]}"
      - name: Upload raw Semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore
          retention-days: 7
