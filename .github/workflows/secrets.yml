# Reusable secrets-scanning gate (Gitleaks OSS CLI, pinned binary).
#
# Installs the pinned Gitleaks release with scripts/install_gitleaks.sh
# (SHA-256 verified) - not the gitleaks-action, which needs a licence key for
# organisations. Fails the job on any finding, or when the scan cannot be
# trusted (fails closed). Secret values are redacted from all output and no
# report is uploaded. A pass means Gitleaks' rules matched nothing in the
# scanned history, not that the repository contains no secrets.
#
# Reuse: runs ShipSafe's scripts from a separate checkout of the tooling
# repository at a pinned commit (see docs/REUSE.md). The caller's workspace
# supplies only the code to scan and its .shipsafe/waivers.yml.
name: secrets (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "git (every commit in history - needs full clone) or dir (working tree only)."
        required: false
        type: string
        default: git
      target:
        description: Directory/repository to scan.
        required: false
        type: string
        default: "."
      config:
        description: >-
          Gitleaks config file in the calling repo. Empty = ./.gitleaks.toml if the
          repo has one, else Gitleaks' default rules with NO allowlist.
        required: false
        type: string
        default: ""
      python-version:
        description: Python version used to run the gate script.
        required: false
        type: string
        default: "3.13"
      tooling-repository:
        description: >-
          Repository that provides ShipSafe's gate scripts. Empty = the calling
          repository (ShipSafe's own CI). Cross-repo callers set "Sid13SST/ShipSafe".
        required: false
        type: string
        default: ""
      tooling-ref:
        description: >-
          Commit of the tooling to run. Empty = the triggering commit. Cross-repo
          callers MUST pass the full 40-character SHA used in their `uses:` line.
        required: false
        type: string
        default: ""
    secrets:
      tooling-token:
        description: Read-only token for the tooling repository (only needed while it is private).
        required: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: the gate errors on a shallow clone in git mode
      - name: Resolve ShipSafe tooling ref
        id: tooling
        env:
          TOOLING_REPO: ${{ inputs.tooling-repository || github.repository }}
          TOOLING_REF: ${{ inputs.tooling-ref || github.sha }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          if [ "$TOOLING_REPO" != "$CALLER_REPO" ] && ! [[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tooling-ref must be a full 40-character commit SHA when ShipSafe runs from another repository (got '$TOOLING_REF'). Branches and tags can move."
            exit 1
          fi
          echo "repo=$TOOLING_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$TOOLING_REF" >> "$GITHUB_OUTPUT"
      - name: Check out ShipSafe tooling at the pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repo }}
          ref: ${{ steps.tooling.outputs.ref }}
          token: ${{ secrets.tooling-token || github.token }}
          path: .shipsafe-tooling
          persist-credentials: false
      - name: Move tooling out of the scanned workspace
        env:
          TOOLING_REPO: ${{ steps.tooling.outputs.repo }}
        run: |
          mv .shipsafe-tooling "$RUNNER_TEMP/shipsafe"
          echo "SHIPSAFE=$RUNNER_TEMP/shipsafe" >> "$GITHUB_ENV"
          echo "ShipSafe tooling $(git -C "$RUNNER_TEMP/shipsafe" rev-parse HEAD) from $TOOLING_REPO"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pinned Gitleaks (checksum verified)
        run: |
          bash "$SHIPSAFE/scripts/install_gitleaks.sh" "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Run secrets gate
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          CONFIG: ${{ inputs.config }}
        run: |
          args=("$TARGET" --mode "$MODE")
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          python "$SHIPSAFE/scripts/secrets_scan.py" "${args[@]}"
