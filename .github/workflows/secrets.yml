# Reusable secrets-scanning gate (Gitleaks OSS CLI, pinned binary).
#
# Installs the pinned Gitleaks release with scripts/install_gitleaks.sh
# (SHA-256 verified) - not the gitleaks-action, which needs a licence key for
# organisations. Fails the job on any finding, or when the scan cannot be
# trusted (fails closed). Secret values are redacted from all output and no
# report is uploaded. A pass means Gitleaks' rules matched nothing in the
# scanned history, not that the repository contains no secrets.
#
# Current scope: called from workflows in this repository. Cross-repo
# packaging is planned - see docs/TASKS.md.
name: secrets (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "git (every commit in history - needs full clone) or dir (working tree only)."
        required: false
        type: string
        default: git
      target:
        description: Directory/repository to scan.
        required: false
        type: string
        default: "."
      config:
        description: Gitleaks config file.
        required: false
        type: string
        default: .gitleaks.toml
      python-version:
        description: Python version used to run the gate script.
        required: false
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: the gate errors on a shallow clone in git mode
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pinned Gitleaks (checksum verified)
        run: |
          bash scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Run secrets gate
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          CONFIG: ${{ inputs.config }}
        run: python scripts/secrets_scan.py "$TARGET" --mode "$MODE" --config "$CONFIG"
