# Reusable dependency-audit gate (pip-audit).
#
# Fails the job when any pinned requirement matches a known advisory in the
# PyPI/OSV data pip-audit queries, or when the audit cannot be completed
# (fails closed). A pass is "no known advisory matched at run time", not a
# guarantee that the dependencies are secure.
#
# Current scope: called from workflows in this repository (it runs
# scripts/dependency_audit.py from the checked-out repo). Packaging for use
# from other repositories is planned - see docs/TASKS.md.
name: dependency-audit (reusable)

on:
  workflow_call:
    inputs:
      requirements:
        description: Space-separated list of fully pinned requirements files to audit.
        required: true
        type: string
      python-version:
        description: Python version used to run pip-audit.
        required: false
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pinned audit tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-tools.txt
      - name: Run dependency-audit gate
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        # Split the space-separated list into an array (no globbing).
        run: |
          read -r -a files <<< "$REQUIREMENTS"
          python scripts/dependency_audit.py "${files[@]}"
