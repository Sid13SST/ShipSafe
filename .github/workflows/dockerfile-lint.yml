# Reusable Dockerfile gate (hadolint, pinned binary, + ShipSafe policy checks).
#
# Installs the pinned hadolint release with scripts/install_hadolint.sh
# (SHA-256 verified) and lints every Dockerfile found under `discover`
# except excluded paths. Fails on hadolint warning/error findings and on the
# ShipSafe policy checks (digest-pinned base, non-root USER, no ADD from URL,
# no secret-named ARG/ENV); fails closed if nothing could be linted. A pass
# means the Dockerfile text passed these lint rules - it says nothing about
# vulnerabilities inside the image.
#
# Reuse: runs ShipSafe's scripts from a separate checkout of the tooling
# repository at a pinned commit (see docs/REUSE.md). The caller's workspace
# supplies only the code to scan and its .shipsafe/waivers.yml.
name: dockerfile-lint (reusable)

on:
  workflow_call:
    inputs:
      discover:
        description: Directory to search for Dockerfiles.
        required: false
        type: string
        default: "."
      exclude:
        description: Space-separated path prefixes to skip during discovery.
        required: false
        type: string
        default: ""
      forbid-paths:
        description: Space-separated paths that must never be linted (gate errors if they are).
        required: false
        type: string
        default: ""
      python-version:
        description: Python version used to run the gate script.
        required: false
        type: string
        default: "3.13"
      tooling-repository:
        description: >-
          Repository that provides ShipSafe's gate scripts. Empty = the calling
          repository (ShipSafe's own CI). Cross-repo callers set "Sid13SST/ShipSafe".
        required: false
        type: string
        default: ""
      tooling-ref:
        description: >-
          Commit of the tooling to run. Empty = the triggering commit. Cross-repo
          callers MUST pass the full 40-character SHA used in their `uses:` line.
        required: false
        type: string
        default: ""
    secrets:
      tooling-token:
        description: Read-only token for the tooling repository (only needed while it is private).
        required: false

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve ShipSafe tooling ref
        id: tooling
        env:
          TOOLING_REPO: ${{ inputs.tooling-repository || github.repository }}
          TOOLING_REF: ${{ inputs.tooling-ref || github.sha }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          if [ "$TOOLING_REPO" != "$CALLER_REPO" ] && ! [[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tooling-ref must be a full 40-character commit SHA when ShipSafe runs from another repository (got '$TOOLING_REF'). Branches and tags can move."
            exit 1
          fi
          echo "repo=$TOOLING_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$TOOLING_REF" >> "$GITHUB_OUTPUT"
      - name: Check out ShipSafe tooling at the pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repo }}
          ref: ${{ steps.tooling.outputs.ref }}
          token: ${{ secrets.tooling-token || github.token }}
          path: .shipsafe-tooling
          persist-credentials: false
      - name: Move tooling out of the scanned workspace
        env:
          TOOLING_REPO: ${{ steps.tooling.outputs.repo }}
        run: |
          mv .shipsafe-tooling "$RUNNER_TEMP/shipsafe"
          echo "SHIPSAFE=$RUNNER_TEMP/shipsafe" >> "$GITHUB_ENV"
          echo "ShipSafe tooling $(git -C "$RUNNER_TEMP/shipsafe" rev-parse HEAD) from $TOOLING_REPO"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pinned hadolint (checksum verified)
        run: |
          bash "$SHIPSAFE/scripts/install_hadolint.sh" "$RUNNER_TEMP/hadolint-bin"
          echo "$RUNNER_TEMP/hadolint-bin" >> "$GITHUB_PATH"
      - name: Run Dockerfile gate
        env:
          DISCOVER: ${{ inputs.discover }}
          EXCLUDE: ${{ inputs.exclude }}
          FORBID: ${{ inputs.forbid-paths }}
        run: |
          read -r -a excludes <<< "$EXCLUDE"
          read -r -a forbids <<< "$FORBID"
          args=(--discover "$DISCOVER")
          for e in "${excludes[@]}"; do args+=(--exclude "$e"); done
          for f in "${forbids[@]}"; do args+=(--forbid-path "$f"); done
          python "$SHIPSAFE/scripts/dockerfile_lint.py" "${args[@]}"
