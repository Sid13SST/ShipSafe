# ShipSafe CI: demo-app tests, gate unit tests, the security gates on the
# clean demo app, and gate self-tests against the deliberately vulnerable
# fixtures/ (which must FAIL the gate for the self-test to pass).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-app-tests:
    name: demo-app tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install demo-app dependencies
        working-directory: demo-app
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
      - name: Run demo-app tests
        working-directory: demo-app
        run: python -m pytest -q

  gate-unit-tests:
    name: gate unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r demo-app/requirements-dev.txt
      - name: Run gate unit tests (offline)
        run: python -m pytest -q scripts/tests

  dependency-audit:
    name: gate - dependency audit (demo-app)
    uses: ./.github/workflows/dependency-audit.yml
    with:
      requirements: demo-app/requirements.txt demo-app/requirements-dev.txt

  dependency-audit-self-test:
    name: self-test - dependency audit catches fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned audit tooling
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-tools.txt
      - name: Assert gate passes on demo-app and fails on fixtures/
        run: bash scripts/verify_dependency_audit.sh
